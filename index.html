<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ya story! - Static Hosting</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Modern CSS Reset & Basics */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        /* Animated Gradient Background */
        body {
            background: linear-gradient(-45deg, #0f172a, #1e293b, #0c4a6e, #020617);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        /* Hide default cursor on devices with a mouse */
        @media (pointer: fine) {
            body, button, input, select, textarea, .close-btn { 
                cursor: none !important; 
            }
        }

        /* Custom Cursor Elements */
        .cursor-dot {
            width: 8px;
            height: 8px;
            background-color: #38bdf8;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s;
        }

        .cursor-outline {
            width: 40px;
            height: 40px;
            border: 2px solid rgba(56, 189, 248, 0.5);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, background-color 0.2s, border-color 0.2s;
        }

        /* Cursor Hover State */
        .cursor-hover .cursor-dot {
            width: 0;
            height: 0;
        }
        .cursor-hover .cursor-outline {
            width: 60px;
            height: 60px;
            background-color: rgba(56, 189, 248, 0.1);
            border-color: #38bdf8;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Abstract Background Glows */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.5;
            animation: float 10s infinite ease-in-out alternate;
        }

        .orb-1 {
            width: 300px; height: 300px;
            background: #38bdf8;
            top: 10%; left: 15%;
        }

        .orb-2 {
            width: 400px; height: 400px;
            background: #818cf8;
            bottom: 10%; right: 10%;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-30px) scale(1.1); }
        }

        /* Main Container (Now ready for 3D Tilt) */
        .container {
            position: relative;
            z-index: 10;
            max-width: 650px;
            padding: 50px 40px;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0;
            animation: containerFadeIn 0.8s ease-out forwards;
            transform-style: preserve-3d;
        }

        /* Pop elements out in 3D when tilted */
        .container h1, .container p, .container button {
            transform: translateZ(30px);
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 15px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            animation: slideUp 0.6s ease-out forwards 0.2s;
        }

        p {
            font-size: 1.15rem;
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 15px;
            color: #cbd5e1;
            opacity: 0;
        }

        p:nth-of-type(1) { animation: slideUp 0.6s ease-out forwards 0.4s; }
        p:nth-of-type(2) { animation: slideUp 0.6s ease-out forwards 0.6s; }

        /* Button Styling */
        .btn {
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: #f8fafc;
            border: none;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            margin-top: 20px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            opacity: 0;
            animation: slideUp 0.6s ease-out forwards 0.8s;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02) translateZ(40px);
            box-shadow: 0 8px 30px rgba(56, 189, 248, 0.6);
            background: linear-gradient(135deg, #7dd3fc, #3b82f6);
        }

        .btn:active { transform: translateY(1px); }
        .btn:disabled { opacity: 0.7; transform: none; }

        /* Modal Overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-content {
            background: #1e293b;
            padding: 40px;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: left;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            transform: scale(0.8) translateY(30px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .modal-overlay.show { display: flex; opacity: 1; }
        .modal-overlay.show .modal-content { transform: scale(1) translateY(0); opacity: 1; }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            background: none;
            border: none;
            color: #64748b;
            font-size: 1.8rem;
            transition: all 0.2s ease;
        }

        .close-btn:hover { color: #f8fafc; transform: rotate(90deg); }
        .modal-content h2 { margin-bottom: 25px; color: #f8fafc; font-size: 1.8rem; font-weight: 700; }

        /* Form Styling & Validation */
        .form-group { margin-bottom: 22px; position: relative; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 1rem; color: #e2e8f0; font-weight: 500; }
        .form-info { font-size: 0.85rem; color: #94a3b8; margin-bottom: 10px; display: block; line-height: 1.4; }
        
        .char-counter {
            position: absolute;
            bottom: -20px;
            right: 5px;
            font-size: 0.8rem;
            color: #94a3b8;
            transition: color 0.3s ease;
        }

        .input-wrapper { position: relative; }
        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 1.1rem;
            transition: color 0.3s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Valid Input Styles */
        .input-wrapper.valid i { color: #10b981; transform: translateY(-50%) scale(1.2); }
        .input-wrapper.valid input { border-color: #10b981; }

        input[type="email"], select, textarea {
            width: 100%;
            padding: 14px 14px 14px 40px;
            border-radius: 10px;
            border: 2px solid #334155;
            background: rgba(15, 23, 42, 0.6);
            color: #f8fafc;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        textarea { padding: 14px; resize: none; min-height: 120px; }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #38bdf8;
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
        }
        input:focus + i, select:focus + i { color: #38bdf8; }

        /* Custom Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #0f172a;
            color: #f8fafc;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            border: 1px solid #334155;
            z-index: 2000;
            transform: translateX(150%);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .toast.show { transform: translateX(0); opacity: 1; }
        .toast.success i { color: #10b981; font-size: 1.3rem; }
        .toast.error i { color: #ef4444; font-size: 1.3rem; }

        @keyframes containerFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="cursor-dot" id="cursorDot"></div>
    <div class="cursor-outline" id="cursorOutline"></div>

    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="container" data-tilt data-tilt-max="5" data-tilt-speed="400" data-tilt-glare data-tilt-max-glare="0.2">
        <h1>Welcome to ya story! <i class="fa-solid fa-sparkles" style="font-size: 2rem; color: #facc15;"></i></h1>
        <p>We host static websites for the people that just want a simple bio or information website.</p>
        <p>Want your own custom site? Feel free to request one below!</p>
        <button class="btn interactive" id="openModalBtn">
            Make a Request <i class="fa-solid fa-arrow-right"></i>
        </button>
    </div>

    <div class="modal-overlay" id="requestModal">
        <div class="modal-content">
            <button class="close-btn interactive" id="closeModalBtn">&times;</button>
            <h2>Request a Website</h2>
            
            <form id="webhookForm">
                <div class="form-group">
                    <label for="email">What is your email?</label>
                    <div class="input-wrapper" id="emailWrapper">
                        <input type="email" id="email" class="interactive" required placeholder="you@example.com">
                        <i class="fa-solid fa-envelope" id="emailIcon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reason">Why do you want a custom website here?</label>
                    <textarea id="reason" class="interactive" required maxlength="500" placeholder="Tell us about your project..."></textarea>
                    <span class="char-counter" id="charCounter">0/500</span>
                </div>

                <div class="form-group">
                    <label for="customHtmlSelect">Do you want to send us custom HTML?</label>
                    <span class="form-info">If yes, please email your files to <strong>support@turbov.dev</strong> after submitting.</span>
                    <div class="input-wrapper">
                        <select id="customHtmlSelect" class="interactive" required style="padding-left: 40px;">
                            <option value="" disabled selected>Select an option...</option>
                            <option value="Yes, I will email the files to support@turbov.dev">Yes, I have custom HTML</option>
                            <option value="No, I need a site made for me">No, I need one built</option>
                        </select>
                        <i class="fa-solid fa-code"></i>
                    </div>
                </div>

                <button type="submit" class="btn interactive" style="width: 100%; margin-top: 10px; animation: none; opacity: 1;">
                    Submit Request <i class="fa-regular fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>

    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toastMessage">Request sent successfully!</span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>

    <script>
        // --- 1. CUSTOM CURSOR LOGIC ---
        const cursorDot = document.getElementById("cursorDot");
        const cursorOutline = document.getElementById("cursorOutline");
        const interactives = document.querySelectorAll(".interactive");

        window.addEventListener("mousemove", (e) => {
            const posX = e.clientX;
            const posY = e.clientY;

            // Direct follow for dot
            cursorDot.style.left = `${posX}px`;
            cursorDot.style.top = `${posY}px`;

            // Smooth follow for outline
            cursorOutline.animate({
                left: `${posX}px`,
                top: `${posY}px`
            }, { duration: 500, fill: "forwards" });
        });

        // Hover effect for buttons and inputs
        interactives.forEach(el => {
            el.addEventListener("mouseenter", () => document.body.classList.add("cursor-hover"));
            el.addEventListener("mouseleave", () => document.body.classList.remove("cursor-hover"));
        });

        // --- 2. LIVE FORM VALIDATION ---
        const emailInput = document.getElementById('email');
        const emailWrapper = document.getElementById('emailWrapper');
        const emailIcon = document.getElementById('emailIcon');
        
        emailInput.addEventListener('input', (e) => {
            // Regex for basic email validation
            const isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e.target.value);
            if(isValid) {
                emailWrapper.classList.add('valid');
                emailIcon.className = 'fa-solid fa-circle-check';
            } else {
                emailWrapper.classList.remove('valid');
                emailIcon.className = 'fa-solid fa-envelope';
            }
        });

        const reasonInput = document.getElementById('reason');
        const charCounter = document.getElementById('charCounter');

        reasonInput.addEventListener('input', (e) => {
            const len = e.target.value.length;
            charCounter.innerText = `${len}/500`;
            
            if (len >= 450) {
                charCounter.style.color = '#ef4444'; // Red
            } else if (len >= 350) {
                charCounter.style.color = '#facc15'; // Yellow
            } else {
                charCounter.style.color = '#94a3b8'; // Default
            }
        });

        // --- 3. MODAL & TOAST LOGIC ---
        const modal = document.getElementById('requestModal');
        const openBtn = document.getElementById('openModalBtn');
        const closeBtn = document.getElementById('closeModalBtn');
        const form = document.getElementById('webhookForm');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');

        const WEBHOOK_URL = "https://discord.com/api/webhooks/1535487464003739738/Q5joJzE5mtbJjf7It1fm-aCbs_UphjXDZ4VH_OezFB-piXu7gp5X-2AbfwxtwdBUqCFN";

        const showToast = (message, type = "success") => {
            toastMessage.innerText = message;
            const icon = toast.querySelector('i');
            if(type === "success") {
                toast.className = 'toast success show';
                icon.className = 'fa-solid fa-circle-check';
            } else {
                toast.className = 'toast error show';
                icon.className = 'fa-solid fa-circle-exclamation';
            }
            setTimeout(() => { toast.classList.remove('show'); }, 4000);
        };

        openBtn.addEventListener('click', () => {
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);
        });

        const closeModal = () => {
            modal.classList.remove('show');
            setTimeout(() => modal.style.display = 'none', 300);
        };

        closeBtn.addEventListener('click', closeModal);
        window.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // --- 4. FORM SUBMISSION ---
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const reason = document.getElementById('reason').value;
            const customHtml = document.getElementById('customHtmlSelect').value;

            const payload = {
                username: "Website Request Bot",
                embeds: [{
                    title: "🚀 New Website Request!",
                    color: 3685848,
                    fields: [
                        { name: "Email Address", value: email, inline: false },
                        { name: "Why do they want a custom website?", value: reason, inline: false },
                        { name: "Custom HTML Status", value: customHtml, inline: false }
                    ],
                    timestamp: new Date().toISOString()
                }]
            };

            try {
                const submitBtn = form.querySelector('button[type="submit"]');
                const originalHtml = submitBtn.innerHTML;
                submitBtn.innerHTML = 'Sending... <i class="fa-solid fa-circle-notch fa-spin"></i>';
                submitBtn.disabled = true;

                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    showToast("Your request was sent successfully!", "success");
                    form.reset();
                    emailWrapper.classList.remove('valid');
                    emailIcon.className = 'fa-solid fa-envelope';
                    charCounter.innerText = '0/500';
                    closeModal();
                } else {
                    showToast("Error sending request. Try again.", "error");
                }

                submitBtn.innerHTML = originalHtml;
                submitBtn.disabled = false;

            } catch (error) {
                console.error("Error:", error);
                showToast("Network error. Check connection.", "error");
            }
        });
    </script>
</body>
</html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* Modern CSS Reset & Basics */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        /* Animated Gradient Background */
        body {
            background: linear-gradient(-45deg, #0f172a, #1e293b, #0c4a6e, #020617);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Abstract Background Glows */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.5;
            animation: float 10s infinite ease-in-out alternate;
        }

        .orb-1 {
            width: 300px; height: 300px;
            background: #38bdf8;
            top: 10%; left: 15%;
        }

        .orb-2 {
            width: 400px; height: 400px;
            background: #818cf8;
            bottom: 10%; right: 10%;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-30px) scale(1.1); }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 10;
            max-width: 650px;
            padding: 50px 40px;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0;
            animation: containerFadeIn 0.8s ease-out forwards;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 15px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            animation: slideUp 0.6s ease-out forwards 0.2s;
        }

        p {
            font-size: 1.15rem;
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 15px;
            color: #cbd5e1;
            opacity: 0;
        }

        /* Staggered text animations */
        p:nth-of-type(1) { animation: slideUp 0.6s ease-out forwards 0.4s; }
        p:nth-of-type(2) { animation: slideUp 0.6s ease-out forwards 0.6s; }

        /* Button Styling & Animation */
        .btn {
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: #f8fafc;
            border: none;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            opacity: 0;
            animation: slideUp 0.6s ease-out forwards 0.8s;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 30px rgba(56, 189, 248, 0.6);
            background: linear-gradient(135deg, #7dd3fc, #3b82f6);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .modal-overlay {
            display: none;

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emma's Website</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: rgba(20, 20, 20, 0.85);
            --text-color: #f3f3f3;
            --accent-color: #ffffff;
            --muted-color: #888888;
            --border-color: #262626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Python Workspace Typing Background */
        #code-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.15;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            z-index: 1;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            margin-bottom: 35px;
            text-align: left;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            color: var(--accent-color);
            display: inline-block;
            overflow: hidden;
            white-space: nowrap;
            border-right: 3px solid var(--accent-color);
            width: 0;
            animation: typing 1.5s steps(20, end) forwards, blink 0.75s step-end infinite;
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes blink {
            from, to { border-color: transparent; }
            50% { border-color: var(--accent-color); }
        }

        section {
            margin-bottom: 30px;
            opacity: 0;
            transform: translateY(15px);
            animation: slideUp 0.6s ease forwards;
        }

        section:nth-child(2) { animation-delay: 0.3s; }
        section:nth-child(3) { animation-delay: 0.5s; }
        section:nth-child(4) { animation-delay: 0.7s; }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--muted-color);
            margin-bottom: 12px;
            font-weight: 600;
        }

        p {
            font-size: 1.05rem;
            margin-bottom: 8px;
            color: var(--text-color);
            min-height: 1.5em;
        }

        ul {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        li {
            background: #1f1f1f;
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        li:hover {
            background: var(--accent-color);
            color: var(--bg-color);
            transform: translateY(-2px);
            border-color: var(--accent-color);
        }

        section:last-of-type ul {
            flex-direction: column;
            gap: 8px;
        }

        section:last-of-type li {
            background: transparent;
            border: none;
            padding: 0;
        }

        section:last-of-type li:hover {
            background: transparent;
            transform: none;
        }

        a {
            color: var(--text-color);
            text-decoration: none;
            display: inline-block;
            position: relative;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -2px;
            left: 0;
            background-color: var(--accent-color);
            transition: width 0.3s ease;
        }

        a:hover {
            color: var(--accent-color);
            background: transparent;
        }

        a:hover::after {
            width: 100%;
        }

        .typing-cursor::after {
            content: '|';
            animation: blink-cursor 0.7s infinite;
            color: var(--accent-color);
            font-weight: bold;
            margin-left: 2px;
        }

        @keyframes blink-cursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <canvas id="code-bg"></canvas>

    <div class="container">
        <header>
            <h1>Hello! im Emma</h1>
        </header>

        <section>
            <h2>Coding languages i know</h2>
            <ul id="languages-list"></ul>
        </section>

        <section>
            <h2>About me</h2>
            <p id="about-1"></p>
            <p id="about-2"></p>
            <p id="about-3"></p>
        </section>

        <section>
            <h2>Music/bands im into</h2>
            <ul id="music-list"></ul>
        </section>
    </div>

    <script>
        // --- 1. PURE PYTHON SYNTAX BACKGROUND ANIMATION ---
        const canvas = document.getElementById('code-bg');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Meaningful, syntactically clean Python snippets
        const pythonStreams = [
            "class Coder:",
            "    def __init__(self, name, age):",
            "        self.name = name",
            "        self.age = age",
            "        self.languages = ['Java', 'Python', 'HTML']",
            "    ",
            "    def play_music(self, instrument):",
            "        return f'{self.name} is jamming on the {instrument}!'",
            "",
            "emma = Coder('Emma', 20)",
            "instruments = ['drums', 'keyboard', 'guitar']",
            "for item in instruments:",
            "    print(emma.play_music(item))",
            "",
            "bands = ['Dry Kill Logic', 'SOAD', 'The Chats', 'Acid Bath']",
            "is_furry = True",
            "if is_furry:",
            "    print('Welcome to Emma\\'s portfolio!')"
        ];

        let activeStreams = [];
        for (let i = 0; i < 6; i++) {
            activeStreams.push({
                lineIndex: Math.floor(Math.random() * pythonStreams.length),
                charIndex: 0,
                x: Math.random() * (canvas.width - 400),
                y: 60 + (i * 90)
            });
        }

        function animatePythonBackground() {
            ctx.fillStyle = 'rgba(10, 10, 10, 0.12)'; // smooth trailing fade
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ffffff';
            ctx.font = '13px monospace';

            activeStreams.forEach(stream => {
                let fullText = pythonStreams[stream.lineIndex];
                let currentText = fullText.substring(0, Math.floor(stream.charIndex));
                
                ctx.fillText(currentText, stream.x, stream.y);

                stream.charIndex += 0.45; // typing progression speed

                // Once a line finishes typing out, transition to a new line
                if (stream.charIndex > fullText.length + 15) {
                    stream.lineIndex = (stream.lineIndex + 1) % pythonStreams.length;
                    stream.charIndex = 0;
                    stream.x = Math.random() * (canvas.width - 400);
                    stream.y = Math.random() * (canvas.height - 50) + 30;
                }
            });

            requestAnimationFrame(animatePythonBackground);
        }
        requestAnimationFrame(animatePythonBackground);


        // --- 2. TYPING EFFECT FOR CONTENT ---
        const languages = ["Java", "Python", "HTML"];
        const aboutLines = [
            "I'm 20 years old.",
            "I know how to play the drums, keyboard, and guitar.",
            "I am a furry!"
        ];
        const musicBands = [
            { name: "Dry Kill Logic", url: "https://open.spotify.com/artist/01JN808vH1vhH7O7IsyRgX?si=eBWULFbgTmy4UTxd2uxIFA" },
            { name: "System of a Down", url: "https://open.spotify.com/artist/5eAWCfyUhZtHHtBdNk56l1?si=Lrk9qAFJQ4uI69a5wMKdZw" },
            { name: "Hive Mind Blunt Rotation", url: "https://open.spotify.com/artist/4DKf2I9FiIqpKcMPnjRpjF?si=V19jg30PR5C0nrTxgxa2JQ" },
            { name: "The Chats", url: "https://open.spotify.com/artist/1aQ7P3HtKOQFW16ebjiks1?si=oCp4PD6VRp-F4LH4IOKLfQ" },
            { name: "Acid Bath", url: "https://open.spotify.com/artist/3n5jeTRWZEbTPJWyHSYUqn?si=oKubhpF6TZ2cG4bCGCvKuw" }
        ];

        function typeText(element, text, speed = 12) {
            return new Promise(resolve => {
                let i = 0;
                element.classList.add('typing-cursor');
                function type() {
                    if (i < text.length) {
                        element.textContent += text.charAt(i);
                        i++;
                        setTimeout(type, speed + Math.random() * 8);
                    } else {
                        element.classList.remove('typing-cursor');
                        resolve();
                    }
                }
                type();
            });
        }

        async function runTypewriter() {
            await new Promise(r => setTimeout(r, 1000));

            // Type Coding Languages
            const langList = document.getElementById('languages-list');
            for (let lang of languages) {
                const li = document.createElement('li');
                langList.appendChild(li);
                await typeText(li, lang, 15);
                await new Promise(r => setTimeout(r, 60));
            }

            // Type About Me Sections
            for (let index = 0; index < aboutLines.length; index++) {
                const p = document.getElementById(`about-${index + 1}`);
                await typeText(p, aboutLines[index], 10);
                await new Promise(r => setTimeout(r, 90));
            }

            // Type Music/Bands Sections
            const musicList = document.getElementById('music-list');
            for (let band of musicBands) {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = band.url;
                a.target = "_blank";
                li.appendChild(a);
                musicList.appendChild(li);
                
                await typeText(a, band.name, 12);
                await new Promise(r => setTimeout(r, 60));
            }
        }

        runTypewriter();

        console.log("%cWelcome to Emma's modern dark-mode site!", "background: #000; color: #fff; padding: 4px 8px; border-radius: 4px; font-weight: bold;");
    </script>
</body>
</html>
